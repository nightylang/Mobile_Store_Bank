# =========================================================================
# MOBILE STORE BANK - EXTENDED DEPLOYMENT ENGINE (ATTENDANCE MODULE UPDATE)
# PIPELINE SERVICE: GITHUB ACTIONS MULTI-STAGE CONTINUOUS DELIVERY RUNNER
# =========================================================================

name: Mobile Store Bank CD Engine

on:
  workflow_run:
    workflows: ["Mobile Store Bank CI Engine"]
    types:
      - completed
    branches: [ "main" ]

jobs:
  deploy-production:
    name: Build Container Image & Deploy to HTTP Live Target Node
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Checkout Production Infrastructure Bundle
      uses: actions/checkout@v4

    - name: Set up Docker Buildx Engines
      uses: docker/setup-buildx-action@v3

    # 1. TRANSMIT DISPATCH ACTIONS TO TARGET DEPLOYMENT HOST MACHINE
    - name: Configure SSH Infrastructure Authentication Handshake
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PROD_SERVER_IP }}
        username: ${{ secrets.PROD_SERVER_USER }}
        key: ${{ secrets.PROD_SERVER_SSH_KEY }}
        script: |
          echo "🌐 Connected to local cleartext HTTP production node machine..."
          cd /apps/MobileStoreBank
          
          echo "📦 Fetching latest verified repository artifacts (Attendance Core Appends)..."
          git pull origin main
          
          # 2. RUN SYSTEM DATABASE SCHEMA SCRIPTS FOR NEW ATTENDANCE TABLES
          # Applies the structured attendance schema changes to MS SQL Server
          echo "🗄️ Executing structural SQL migrations..."
          docker exec msb_production_sql_node /opt/mssql-tools/bin/sqlcmd \
            -S localhost -U sa -P "SeniorDevPass_10.0_GA!" \
            -Q "IF OBJECT_ID('dbo.AttendanceRecords', 'U') IS NULL CREATE TABLE dbo.AttendanceRecords (Id BIGINT IDENTITY(1,1) NOT NULL, UserIdentity NVARCHAR(150) NOT NULL, Timestamp DATETIME2(7) NOT NULL DEFAULT GETUTCDATE(), ActionType NVARCHAR(50) NOT NULL, TerminalNode NVARCHAR(100) NOT NULL DEFAULT 'PYTHON-VISION-NODE', CONSTRAINT PK_AttendanceRecords PRIMARY KEY CLUSTERED (Id));"
          
          echo "🐳 Rebuilding multi-stage isolated container environment networks..."
          docker compose down --remove-orphans
          docker compose up --build -d
          
          echo "✅ CD execution block successfully provisioned on target host!"
          
